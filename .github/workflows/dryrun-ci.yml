name: UNet OASIS — Dry Run

on:
  push:
    branches:
      - feature-jingjian
  workflow_dispatch:

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install nibabel numpy matplotlib tqdm Pillow

      - name: Create dummy dataset
        run: |
          mkdir -p sample_data/images sample_data/masks
          echo "import numpy as np, os" > create_dummy.py
          echo "from PIL import Image" >> create_dummy.py
          echo "os.makedirs('sample_data/images', exist_ok=True)" >> create_dummy.py
          echo "os.makedirs('sample_data/masks', exist_ok=True)" >> create_dummy.py
          echo "for i in range(3):" >> create_dummy.py
          echo "    img = (np.random.rand(64,64)*255).astype('uint8')" >> create_dummy.py
          echo "    mask = (np.random.rand(64,64)>0.5).astype('uint8')*255" >> create_dummy.py
          echo "    Image.fromarray(img).save(f'sample_data/images/slice_{i}.png')" >> create_dummy.py
          echo "    Image.fromarray(mask).save(f'sample_data/masks/slice_{i}.png')" >> create_dummy.py
          echo "print('✅ Dummy dataset created successfully.')" >> create_dummy.py
          python create_dummy.py

      - name: Run training dry-run
        working-directory: recognition/unet_oasis_jingjian
        run: |
          python train.py --data-root ../../sample_data --epochs 1 --batch-size 1 --dry-run || echo "Dry run complete"

      - name: List output files
        run: |
          echo "=== Output folders ==="
          ls -R recognition/unet_oasis_jingjian || true
