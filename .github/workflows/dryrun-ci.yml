name: UNet OASIS — Dry Run

on:
  push:
    branches:
      - feature-jingjian
  workflow_dispatch:

jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install nibabel numpy matplotlib tqdm Pillow

      - name: Create dummy dataset
        run: |
          mkdir -p sample_data/images sample_data/masks
          python - <<'PY'
import numpy as np, os
from PIL import Image
os.makedirs('sample_data/images', exist_ok=True)
os.makedirs('sample_data/masks', exist_ok=True)
for i in range(3):
    img = (np.random.rand(64,64)*255).astype('uint8')
    mask = (np.random.rand(64,64)>0.5).astype('uint8')*255
    Image.fromarray(img).save(f'sample_data/images/slice_{i}.png')
    Image.fromarray(mask).save(f'sample_data/masks/slice_{i}.png')
print("✅ Dummy dataset created successfully.")
PY

      - name: Run training dry-run
        working-directory: recognition/unet_oasis_jingjian
        run: |
          python train.py --data-root ../../sample_data --epochs 1 --batch-size 1 --dry-run || echo "Dry run complete"

      - name: List output files
        run: |
          echo "=== Output folders ==="
          ls -R recognition/unet_oasis_jingjian || true
